services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: curves_and_tees
      MYSQL_USER: curves_user
      MYSQL_PASSWORD: curves_password_2026
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: "Curves & Tees"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "base64:2mQUsSrB5jhtEvHMVWTrVtyS4dL1p2dsSAFqhMU0yiU="
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: curves_and_tees
      DB_USERNAME: curves_user
      DB_PASSWORD: curves_password_2026
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: database
      CACHE_STORE: database
      FILESYSTEM_DISK: local
      ADMIN_EMAIL: admin@curvesandtees.com
      ADMIN_PASSWORD: password
      RUN_MIGRATIONS: "true"
    ports:
      - "8000:8000"
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]

volumes:
  dbdata: